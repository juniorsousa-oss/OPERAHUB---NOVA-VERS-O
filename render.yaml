services:
  - type: web
    name: opera-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://cuixazpxkvniqldmmnth.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_ZTqIgmA9Ez6AVQsoXa0P8Q_6CYHDFye
      - key: SUPABASE_WRITE_TOKEN
        sync: false
