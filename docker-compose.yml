services:
  opera-hub:
    build:
      context: https://github.com/juniorsousa-oss/OPERAHUB---NOVA-VERS-O.git#main
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_WRITE_TOKEN: ${SUPABASE_WRITE_TOKEN}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.operahub.rule=Host(`${OPERA_HUB_DOMAIN:-operahub.nexonlabs.com.br}`)"
      - traefik.http.routers.operahub.entrypoints=websecure
      - traefik.http.routers.operahub.tls=true
      - traefik.http.routers.operahub.tls.certresolver=letsencrypt
      - traefik.http.services.operahub.loadbalancer.server.port=8000
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
