name: Validate Opera Hub

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        organization:
          - setta
          - opera-hub-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile app.py

      - name: Unit tests — admin and tenant module visibility
        env:
          OPERAHUB_DEFAULT_ORG: ${{ matrix.organization }}
          OPERAHUB_TENANT_DOMAIN: operahub.nexonlabs.com.br
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-publishable-key
          SUPABASE_WRITE_TOKEN: ""
          SECRET_KEY: ci-test-key
          ADMIN_PASSWORD: ""
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke test Flask
        env:
          OPERAHUB_DEFAULT_ORG: ${{ matrix.organization }}
          OPERAHUB_TENANT_DOMAIN: operahub.nexonlabs.com.br
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-publishable-key
          SUPABASE_WRITE_TOKEN: ""
          SECRET_KEY: ci-test-key
          ADMIN_PASSWORD: ""
        run: |
          python - <<'PY'
          import os
          from app import app

          app.config["TESTING"] = True
          client = app.test_client()

          health = client.get("/healthz")
          assert health.status_code == 200

          root_login = client.get("/login")
          assert root_login.status_code == 200

          home = client.get("/", follow_redirects=False)
          if os.environ["OPERAHUB_DEFAULT_ORG"] == "opera-hub-demo":
              assert home.status_code == 302, home.status_code
              assert "/login" in home.headers["Location"]
          else:
              assert home.status_code == 200, home.status_code

          demo_health = client.get(
              "/healthz",
              headers={"Host": "demo.operahub.nexonlabs.com.br"},
          )
          demo_payload = demo_health.get_json()
          assert demo_payload["active_organization"] == "opera-hub-demo"
          assert demo_payload["resolved_by_host"] == "opera-hub-demo"

          demo_home = client.get(
              "/",
              headers={"Host": "demo.operahub.nexonlabs.com.br"},
              follow_redirects=False,
          )
          assert demo_home.status_code == 302, demo_home.status_code
          assert "/login" in demo_home.headers["Location"]

          setta_home = client.get(
              "/",
              headers={"Host": "setta.operahub.nexonlabs.com.br"},
              follow_redirects=False,
          )
          assert setta_home.status_code == 200, setta_home.status_code

          unknown_home = client.get(
              "/",
              headers={"Host": "cliente-inexistente.operahub.nexonlabs.com.br"},
              follow_redirects=False,
          )
          assert unknown_home.status_code == 404, unknown_home.status_code

          print("Smoke test OK")
          PY
